    url: ${DB_URL:jdbc:postgresql://dp1-bd.cjw9vckmfqz8.us-east-1.rds.amazonaws.com:5432/Tasf_b2b}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Furiousandfast.8}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Fase 1 (alineación model↔BD): red de seguridad. validate SOLO comprueba que las
      # @Entity casan con el esquema real; NUNCA modifica la BD (no usar update/create en RDS).
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Fase 6B: la ingesta sube los TXT de envíos (pueden ser cientos de MB). Volcado a disco
      # temprano (file-size-threshold) para no cargarlos en heap.
      max-file-size: 512MB
      max-request-size: 2GB
      file-size-threshold: 2MB
      
