# ── Planificador: hiperparámetros del ALNS y de los 3 escenarios ────────────
planificador:
  scenario:
    sa-minutos: 5                       # Salto del algoritmo (Sa, en min)
    ta-segundos: 10                     # Tiempo de algoritmo (Ta) FIJO por bloque. Debe ser < Sa·60.
                                        # Cada bloque corre Ta segundos y duerme (Sa·60 - Ta) → wall-clock = Sa.

    # Acota la simulación a un número máximo de ventanas de Sa minutos.
    # 0 = procesar todo el dataset cargado.
    # 144 ventanas/día con Sa=10. Ejemplos:
    #   432    →  3 días
    #   720    →  5 días
    #   1008   →  7 días
    #   4320   → 30 días
    #   52560  → 365 días
    max-ventanas: 720

    # E3 (hasta colapso): tope de ventanas de Sa min SOLO para el escenario 3. 0 = recorrer TODO el
    # dataset hasta el fin (el E3 se detiene solo al colapsar). max-ventanas (arriba) NO aplica a E3:
    # con 720 y K=144 E3 quedaba en ~5 bloques (2,5 días) sin llegar nunca al colapso.
    max-ventanas-colapso: 0

    # Anti-OOM (Fase 1): nº de bloques recientes cuyas asignaciones + series por slot se retienen en
    # RAM por job (el resto se purga; el front consume /bloques y /asignaciones incrementalmente).
    # Antes era 500 hardcoded. Bajar = menos RAM; subir = más holgura si el front se atrasa.
    max-bloques-buffer: 35

    # Anti-OOM (Fase 2): nº de jobs TERMINADOS recientes que conservan sus bloques/acumuladores en RAM
    # (el front anima el último); de los más viejos se liberan (sus rutas están en BD, el ZIP en disco).
    # Evita que correr varias simulaciones seguidas acumule RAM hasta reiniciar.
    max-jobs-en-memoria: 3

    # K FIJO por escenario (regla de negocio): E1=1, E2=144, E3=144. NO configurable por
    # request — los endpoints devuelven 400 si llega un k distinto.
    k-default-1: 1
    k-default-2: 144
    k-default-3: 144
    umbral-colapso: 0.01
    umbral-colapso-backlog: 1000
    simular-tiempo-real-1: false            # E1 día a día: duerme (Sa - Ta). El perfil smoke lo pone en false
    simular-tiempo-real-2: false           # El perfil smoke pondrá esto en false
    simular-tiempo-real-3: false
    # Fase T (N3): pre-calienta la caché de esqueletos con la demanda de la ventana antes del bucle
    # de bloques (Dijkstra fuera de Ta). Sube throughput en arranque limpio. false = off (revertir).
    prewarm-skeletons: true

  alns:
    iteraciones-base: 9                  # El perfil smoke pondrá esto en 3
    iteraciones-cerca-colapso: 25
    destroy-factor: 0.20
    initial-temp: 500.0
    cooling-rate: 0.85
    min-temp: 0.1
    min-block-size: 3
    segment-length: 3
    reaction-factor: 0.15
    operadores-destroy:
      - capacity
      - worst-route
      - random
      - airport-congestion

  objetivo:
    peso-transit: 1.0
    peso-tarde: 5000.0
    peso-uso-almacen: 50.0
    peso-uso-vuelo: 20.0

  # Fase L/O/P/Q — enrutado storage-aware (libera almacén-día de hub para los SLA cortos).
  # Perillas tuneables sin recompilar; la dirección está probada (cada subida de reserva /
  # bajada de umbral / curva más agresiva ha movido el primer fallo). Reversión si aparecen
  # fallos tempranos de 48h (firma J3): bajar reserva / subir umbral / subir exponente.
  #
  # Fase R (NEUTRALIZADO) — el modelo de almacén pasó a OCUPACIÓN CONCURRENTE por slot (no
  # throughput diario). L/O/P/Q repartían un cuello ARTIFICIAL del modelo de cubo-diario; con
  # el modelo correcto el almacén deja de ser el cuello, así que se neutralizan para medir
  # limpio: reserva=0 (sin colchón), re-seed=0 (sin inyección hub-avoiding), umbral=0.99 (casi
  # ningún nodo se marca hub ⇒ L1/L2 inertes). Reactivables si el almacén volviera a apretar.
  storage-aware:
    reserva-almacen-base: 0.0       # R5: sin colchón (L2 inerte)
    umbral-hub-pico: 0.99           # R5: casi nadie es hub (L1/L2/O inertes)
    precio-hub-exponente: 1.7       # (sin efecto si no hay hubs)
    re-seed-slice: 0                # R5: re-seed hub-avoiding desactivado (Q inerte)

  backlog:
    max-size: 10000
    purgar-vencidas: true
    umbral-replanificacion-slack: 0.10
    max-replanificaciones-por-bloque: 20
    # Fase M (anti-thrash): tope de envíos del backlog reprocesados por bloque (los más
    # urgentes por deadline; el resto se difiere sin perderse). 0 = sin tope. Acota que el
    # backlog le robe Ta a la demanda nueva y dispare violaciones de Ta. Tunear con la medición.
    max-reproceso-por-bloque: 3000

  # Anti-OOM (endpoints de consulta): acotan cuánta memoria pide una sola request de telemetría
  # mientras un job pesado corre en paralelo, para que la respuesta materializada en RAM no agote
  # el heap. /vuelos/carga y /almacenes/ocupacion paginan por desde/limit; /demanda/resumen agrega
  # en SQL y acota el span del rango.
  consulta:
    max-filas-pagina: 5000      # tope de filas por página (limit por defecto) en /vuelos/carga y /almacenes/ocupacion
    demanda-max-dias: 31        # span máximo (días) de /demanda/resumen (acota el escaneo de BD)
