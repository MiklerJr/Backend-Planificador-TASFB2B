spring:
  datasource:
    # BD de PRODUCCIÓN (VM, túnel local en el puerto 5433): descomentar este bloque (y comentar el activo) para apuntar a producción.
#    url: jdbc:postgresql://127.0.0.1:5433/Tasf_b2b
#    username: postgres
#    password: Furiousandfast.8
    # BD LOCAL en Docker (host.docker.internal): descomentar este bloque (y comentar el activo) para correr contra un Postgres del host desde el contenedor.
#    url: jdbc:postgresql://host.docker.internal:5432/Tasf_b2b
#    username: postgres
#    password: Furiousandfast.8
    # BD de PRUEBAS (AWS RDS). Activa por defecto.
    # socketTimeout=180: un read sin respuesta en 3 min falla (el COPY colgado se detecta y reintenta)
    # en vez de quedar zombie para siempre. La conexión Perú→us-east-1 se corta en transferencias largas.
    # tcpKeepAlive: el SO detecta conexiones muertas antes.
    url: jdbc:postgresql://dp1-bd.cjw9vckmfqz8.us-east-1.rds.amazonaws.com:5432/Tasf_b2b?socketTimeout=180&tcpKeepAlive=true
    username: postgres
    password: Furiousandfast.8
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      max-lifetime: 120000
      keepalive-time: 30000
      connection-timeout: 30000
      validation-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 6GB
      file-size-threshold: 2MB

server:
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

data:
  airports:
    file: ${DATA_AIRPORTS_FILE:data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt}
  flights:
    file: ${DATA_FLIGHTS_FILE:data/planes_vuelo.txt}
  baggage:
    dir: ${DATA_BAGGAGE_DIR:data/_envios_preliminar_/}

# ── Planificador: hiperparámetros del ALNS y de los 3 escenarios ────────────
planificador:
  scenario:
    sa-minutos: 5                       # Salto del algoritmo (Sa, en min)
    ta-segundos: 10                     # Tiempo de algoritmo (Ta) FIJO por bloque. Debe ser < Sa·60.
                                        # Cada bloque corre Ta segundos y duerme (Sa·60 - Ta) → wall-clock = Sa.

    # Acota la simulación a un número máximo de ventanas de Sa minutos.
    # 0 = procesar todo el dataset cargado.
    # 144 ventanas/día con Sa=10. Ejemplos:
    #   432    →  3 días
    #   720    →  5 días
    #   1008   →  7 días
    #   4320   → 30 días
    #   52560  → 365 días
    max-ventanas: 720

    max-ventanas-colapso: 0
    max-bloques-buffer: 35
    max-asignaciones-buffer: 100000
    max-jobs-en-memoria: 3

    k-default-1: 1
    k-default-2: 144
    k-default-3: 144
    umbral-colapso: 0.01
    umbral-colapso-backlog: 1000
    simular-tiempo-real-1: true           # E1 día a día: duerme (Sa - Ta). El perfil smoke lo pone en false
    simular-tiempo-real-2: true           # El perfil smoke pondrá esto en false
    simular-tiempo-real-3: true           # E3 duerme (Sa·60 − Ta) entre bloques como E1/E2; su warm-up de fechaInicio va a cadencia Ta fija (sin Sa)
    prewarm-skeletons: true

  alns:
    iteraciones-base: 9                  # El perfil smoke pondrá esto en 3
    iteraciones-cerca-colapso: 25
    destroy-factor: 0.20
    initial-temp: 500.0
    cooling-rate: 0.85
    min-temp: 0.1
    min-block-size: 3
    segment-length: 3
    reaction-factor: 0.15
    operadores-destroy:
      - capacity
      - worst-route
      - random
      - airport-congestion

  objetivo:
    peso-transit: 1.0
    peso-tarde: 5000.0
    peso-uso-almacen: 50.0
    peso-uso-vuelo: 20.0

  storage-aware:
    reserva-almacen-base: 0.0
    umbral-hub-pico: 0.99
    precio-hub-exponente: 1.7
    re-seed-slice: 0

  backlog:
    max-size: 10000
    purgar-vencidas: true
    umbral-replanificacion-slack: 0.10
    max-replanificaciones-por-bloque: 20
    max-reproceso-por-bloque: 3000

  consulta:
    max-filas-pagina: 5000

  operativo:
    tiempo-min-escala-minutos: 10
    tiempo-recojo-destino-minutos: 15

  cache:
    skeleton-file: data/skeleton-cache.bin

  memoria:
    purga-ocupacion-cada-bloques: 20
    purga-ocupacion-retencion-dias: 7

  fragmentacion:
    habilitada: true                 # false = comportamiento actual exacto
    max-maletas-por-sublote: 150     # 0 = auto = max(capacidad de avión) del grafo de la corrida
    max-sublotes: 64                 # tope de sub-lotes por envío (anti-abuso ante cantidad absurda)
