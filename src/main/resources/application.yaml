# ── Planificador: hiperparámetros del ALNS y de los 3 escenarios ────────────
planificador:
  scenario:
    sa-minutos: 5                       # Salto del algoritmo (Sa, en min)
    ta-segundos: 10                     # Tiempo de algoritmo (Ta) FIJO por bloque. Debe ser < Sa·60.
                                        # Cada bloque corre Ta segundos y duerme (Sa·60 - Ta) → wall-clock = Sa.

    # Acota la simulación a un número máximo de ventanas de Sa minutos.
    # 0 = procesar todo el dataset cargado.
    # 144 ventanas/día con Sa=10. Ejemplos:
    #   432    →  3 días
    #   720    →  5 días
    #   1008   →  7 días
    #   4320   → 30 días
    #   52560  → 365 días
    max-ventanas: 720

    # E3 (hasta colapso): tope de ventanas de Sa min SOLO para el escenario 3. 0 = recorrer TODO el
    # dataset hasta el fin (el E3 se detiene solo al colapsar). max-ventanas (arriba) NO aplica a E3:
    # con 720 y K=144 E3 quedaba en ~5 bloques (2,5 días) sin llegar nunca al colapso.
    max-ventanas-colapso: 0

    max-bloques-buffer: 35

    # Presupuesto REAL del buffer de bloques: tope de asignaciones retenidas (0 = solo manda
    # max-bloques-buffer). Al final del dataset un bloque de 12 h trae ~11.800 asignaciones, así que
    # 35 bloques podían retener ~400k. max-bloques-buffer sigue como tope secundario y siempre queda
    # al menos el último bloque publicado (el contrato de /bloques y /asignaciones no cambia:
    # devuelven lista vacía + primerBloqueDisponible cuando el `desde` pedido ya fue purgado).
    max-asignaciones-buffer: 100000

    max-jobs-en-memoria: 3

    k-default-1: 1
    k-default-2: 144
    k-default-3: 144
    umbral-colapso: 0.01
    umbral-colapso-backlog: 1000
    simular-tiempo-real-1: true            # E1 día a día: duerme (Sa - Ta). El perfil smoke lo pone en false
    simular-tiempo-real-2: true           # El perfil smoke pondrá esto en false
    simular-tiempo-real-3: true           # E3 duerme (Sa·60 − Ta) entre bloques como E1/E2; su warm-up de fechaInicio va a cadencia Ta fija (sin Sa)
    prewarm-skeletons: true

  alns:
    iteraciones-base: 9                  # El perfil smoke pondrá esto en 3
    iteraciones-cerca-colapso: 25
    destroy-factor: 0.20
    initial-temp: 500.0
    cooling-rate: 0.85
    min-temp: 0.1
    min-block-size: 3
    segment-length: 3
    reaction-factor: 0.15
    operadores-destroy:
      - capacity
      - worst-route
      - random
      - airport-congestion

  objetivo:
    peso-transit: 1.0
    peso-tarde: 5000.0
    peso-uso-almacen: 50.0
    peso-uso-vuelo: 20.0

  storage-aware:
    reserva-almacen-base: 0.0       # R5: sin colchón (L2 inerte)
    umbral-hub-pico: 0.99           # R5: casi nadie es hub (L1/L2/O inertes)
    precio-hub-exponente: 1.7       # (sin efecto si no hay hubs)
    re-seed-slice: 0                # R5: re-seed hub-avoiding desactivado (Q inerte)

  backlog:
    max-size: 10000
    purgar-vencidas: true
    umbral-replanificacion-slack: 0.10
    max-replanificaciones-por-bloque: 20
    max-reproceso-por-bloque: 3000

  consulta:
    max-filas-pagina: 5000      # tope de filas por página (limit por defecto) en /vuelos/carga y /almacenes/ocupacion

  operativo:
    tiempo-min-escala-minutos: 10
    tiempo-recojo-destino-minutos: 15

  cache:
    skeleton-file: data/skeleton-cache.bin

  memoria:
    # Contención de RAM en corridas largas: la ocupación global (vuelo-día y slots de almacén)
    # crece sin tope aunque nada vuelva a consultarla (horizonte de ruta 3 días, SLA máx 48 h).
    purga-ocupacion-cada-bloques: 20   # 0 = nunca purgar
    purga-ocupacion-retencion-dias: 7  # días conservados detrás del cursor; 0 = nunca purgar

  fragmentacion:
    habilitada: true                 # false = comportamiento actual exacto
    max-maletas-por-sublote: 150     # 0 = auto = max(capacidad de avión) del grafo de la corrida
    max-sublotes: 64                 # tope de sub-lotes por envío (anti-abuso ante cantidad absurda)
